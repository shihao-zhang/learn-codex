<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">s12 小样：失败路径 trace</title>
  <desc id="desc">s12 的教学抽象失败路径图。它展示实时网络或桌面状态请求被拒绝、上下文压力、指令冲突和恢复选择。它不是 OpenAI 官方架构图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style><![CDATA[
      .canvas { fill: #F8FAFC; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { rx: 8; ry: 8; stroke-width: 2; }
      .teaching { fill: #FBFAFF; stroke: #6B5B95; stroke-dasharray: 4 4; }
      .fail { fill: #FFF7ED; stroke: #C2410C; }
      .recovery { fill: #EFF6FF; stroke: #2563EB; }
      .neutral { fill: #FFFFFF; stroke: #CBD5E1; }
      .card-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .card-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .chip-text { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .badge-text { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-red { fill: none; stroke: #C2410C; stroke-width: 2.5; marker-end: url(#arrow-red); }
      .line-blue { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .dash-red { fill: none; stroke: #C2410C; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-red); }
    ]]></style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1280" height="1280"/>
  <text class="title" x="40" y="48">s12 小样：失败路径 trace</text>
  <text class="subtitle" x="40" y="78">基于 s12 mock failure path 的教学抽象图，不是 OpenAI 官方架构图。</text>

  <rect x="1010" y="34" width="110" height="26" rx="13" fill="#6B5B95"/>
  <text class="badge-text" x="1032" y="52">教学抽象</text>
  <text class="tiny" x="1130" y="53">所有节点</text>

  <path class="line" d="M 220 211 L 249 211"/>
  <path class="line-red" d="M 440 211 L 469 211"/>
  <path class="line" d="M 660 211 L 689 211"/>
  <path class="line-red" d="M 880 211 L 909 211"/>
  <path class="line-blue" d="M 1050 296 C 1050 330 1030 350 1010 379"/>
  <path class="dash-red" d="M 565 296 C 565 328 565 348 565 379"/>

  <g>
    <rect class="card teaching" x="40" y="126" width="180" height="170"/>
    <rect x="58" y="146" width="40" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="72" y="162">F1</text>
    <text class="card-title" x="58" y="192">任务输入</text>
    <text class="card-body" x="58" y="222">
      <tspan x="58" dy="0">用户请求实时网络</tspan>
      <tspan x="58" dy="19">调研和桌面状态。</tspan>
    </text>
    <rect x="58" y="264" width="70" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="68" y="279">input</text>
  </g>

  <g>
    <rect class="card teaching" x="250" y="126" width="190" height="170"/>
    <rect x="268" y="146" width="40" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="282" y="162">F2</text>
    <text class="card-title" x="268" y="192">工具路由</text>
    <text class="card-body" x="268" y="222">
      <tspan x="268" dy="0">离线教学工具表中</tspan>
      <tspan x="268" dy="19">没有可用 handler。</tspan>
    </text>
    <rect x="268" y="264" width="120" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="278" y="279">tool_dispatch</text>
  </g>

  <g>
    <rect class="card fail" x="470" y="126" width="190" height="170"/>
    <rect x="488" y="146" width="40" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="502" y="162">F3</text>
    <rect x="532" y="146" width="54" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="549" y="162">拒绝</text>
    <text class="card-title" x="488" y="192">权限判断</text>
    <text class="card-body" x="488" y="222">
      <tspan x="488" dy="0">网络 fallback 被</tspan>
      <tspan x="488" dy="19">教学策略拒绝。</tspan>
    </text>
    <rect x="488" y="264" width="78" height="20" rx="10" fill="#FFEDD5" stroke="#FDBA74"/>
    <text class="chip-text" x="498" y="279">deny</text>
  </g>

  <g>
    <rect class="card teaching" x="690" y="126" width="190" height="170"/>
    <rect x="708" y="146" width="40" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="722" y="162">F4</text>
    <text class="card-title" x="708" y="192">上下文压力</text>
    <text class="card-body" x="708" y="222">
      <tspan x="708" dy="0">继续前先记录</tspan>
      <tspan x="708" dy="19">预算压力。</tspan>
    </text>
    <rect x="708" y="264" width="128" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="718" y="279">used=96/100</text>
  </g>

  <g>
    <rect class="card fail" x="910" y="126" width="280" height="170"/>
    <rect x="928" y="146" width="40" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="942" y="162">F5</text>
    <rect x="976" y="146" width="54" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="993" y="162">失败</text>
    <text class="card-title" x="928" y="192">指令冲突</text>
    <text class="card-body" x="928" y="222">
      <tspan x="928" dy="0">用户要外部状态，</tspan>
      <tspan x="928" dy="19">项目离线规则胜出。</tspan>
    </text>
    <rect x="928" y="264" width="150" height="20" rx="10" fill="#FFEDD5" stroke="#FDBA74"/>
    <text class="chip-text" x="938" y="279">winning_layer=project</text>
  </g>

  <g>
    <rect class="card neutral" x="430" y="380" width="300" height="132"/>
    <rect x="448" y="400" width="92" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="472" y="416">未执行</text>
    <text class="card-title" x="448" y="448">真实副作用</text>
    <text class="card-body" x="448" y="478">
      <tspan x="448" dy="0">没有联网检索。</tspan>
      <tspan x="448" dy="19">没有桌面状态读取。</tspan>
    </text>
  </g>

  <g>
    <rect class="card recovery" x="830" y="380" width="360" height="150"/>
    <rect x="848" y="400" width="40" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="862" y="416">F6</text>
    <rect x="896" y="400" width="78" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="923" y="416">恢复</text>
    <text class="card-title" x="848" y="448">把控制权还给人</text>
    <text class="card-body" x="848" y="478">
      <tspan x="848" dy="0">安全停止，并提供选择：</tspan>
      <tspan x="848" dy="19">用离线 fixture 或申请授权。</tspan>
    </text>
    <rect x="848" y="506" width="174" height="20" rx="10" fill="#DBEAFE" stroke="#93C5FD"/>
    <text class="chip-text" x="858" y="521">needs_human_choice</text>
  </g>

  <g>
    <rect class="card neutral" x="40" y="576" width="1150" height="124"/>
    <text class="card-title" x="62" y="608">图例与边界</text>

    <rect x="62" y="628" width="74" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="77" y="644">官方事实</text>
    <text class="tiny" x="146" y="644">需要固定 SHA 或官方文档证据</text>

    <rect x="410" y="628" width="64" height="22" rx="11" fill="#B7791F"/>
    <text class="badge-text" x="424" y="644">待核实</text>
    <text class="tiny" x="484" y="644">s08/s10 等未闭环语义继续保守</text>

    <rect x="820" y="628" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="839" y="644">教学抽象</text>
    <text class="tiny" x="922" y="644">本图来自 mock trace</text>

    <rect x="62" y="662" width="78" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="76" y="678">失败/拒绝</text>
    <text class="tiny" x="150" y="678">停下或拒绝动作的原因</text>

    <rect x="410" y="662" width="86" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="428" y="678">恢复选择</text>
    <text class="tiny" x="506" y="678">安全下一步，通常需要人类选择</text>

    <text class="mono" x="820" y="678">来源：s12 mock --path failure, F1-F6</text>
  </g>

  <g>
    <rect class="card neutral" x="40" y="740" width="1150" height="210"/>
    <text class="card-title" x="62" y="774">小样边界</text>

    <rect class="card teaching" x="62" y="804" width="326" height="104"/>
    <text class="card-title" x="84" y="836">Mermaid 仍是主机制图</text>
    <text class="card-body" x="84" y="864">
      <tspan x="84" dy="0">本 SVG 只是可选教学图。</tspan>
      <tspan x="84" dy="19">不替代 diagram.mmd。</tspan>
    </text>

    <rect class="card teaching" x="432" y="804" width="326" height="104"/>
    <text class="card-title" x="454" y="836">节点中文，字段保留</text>
    <text class="card-body" x="454" y="864">
      <tspan x="454" dy="0">F1-F6 来自 Python mock。</tspan>
      <tspan x="454" dy="19">英文 chip 只用于追溯字段。</tspan>
    </text>

    <rect class="card teaching" x="802" y="804" width="326" height="104"/>
    <text class="card-title" x="824" y="836">待核实仍待核实</text>
    <text class="card-body" x="824" y="864">
      <tspan x="824" dy="0">s08/s10 相关语义继续</tspan>
      <tspan x="824" dy="19">保留当前待核实边界。</tspan>
    </text>
  </g>
</svg>
