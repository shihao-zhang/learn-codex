<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">s07 辅助图：模型选择的四个影响面</title>
  <desc id="desc">s07 的可选教学辅助图，展示 config、auth、provider 和 model 选择如何影响成本、能力、合规与可用性；本图不是 OpenAI 官方架构图，不读取真实凭据，也不承诺最新模型列表或默认值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style><![CDATA[
      .canvas { fill: #F8FAFC; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section-label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { rx: 8; ry: 8; stroke-width: 2; }
      .fact { fill: #F0FDFA; stroke: #176B87; }
      .teaching { fill: #FBFAFF; stroke: #6B5B95; stroke-dasharray: 4 4; }
      .pending { fill: #FFFBEB; stroke: #B7791F; stroke-dasharray: 7 5; }
      .fail { fill: #FFF7ED; stroke: #C2410C; }
      .recovery { fill: #EFF6FF; stroke: #2563EB; }
      .neutral { fill: #FFFFFF; stroke: #CBD5E1; }
      .axis { fill: #FFFFFF; stroke: #CBD5E1; }
      .card-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .card-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .chip-text { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .badge-text { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #94A3B8; stroke-width: 1.7; marker-end: url(#arrow); }
      .line-red { fill: none; stroke: #C2410C; stroke-width: 2.5; marker-end: url(#arrow-red); }
      .line-blue { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    ]]></style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1280" height="1280"/>
  <text class="title" x="40" y="48">s07 辅助图：模型选择的四个影响面</text>
  <text class="subtitle" x="40" y="78">Mermaid 仍是主机制图；本 SVG 只解释 config / auth / provider / model 的产品取舍边界。</text>

  <rect x="1014" y="34" width="54" height="26" rx="13" fill="#176B87"/>
  <text class="badge-text" x="1026" y="52">FACT</text>
  <rect x="1082" y="34" width="92" height="26" rx="13" fill="#6B5B95"/>
  <text class="badge-text" x="1101" y="52">教学辅助</text>

  <text class="section-label" x="40" y="124">主路径：先形成可执行请求上下文，再把产品影响面讲清楚。</text>

  <path class="line" d="M 240 234 L 286 234"/>
  <path class="line" d="M 512 234 L 558 234"/>
  <path class="line" d="M 780 234 L 826 234"/>
  <path class="line" d="M 1016 234 L 1062 234"/>

  <path class="line-soft" d="M 646 326 C 594 372 420 398 272 418"/>
  <path class="line-soft" d="M 688 326 C 672 370 626 396 526 418"/>
  <path class="line-soft" d="M 730 326 C 760 370 842 396 946 418"/>
  <path class="line-soft" d="M 772 326 C 848 370 1036 396 1102 418"/>

  <path class="line-red" d="M 650 604 C 650 632 682 650 722 668"/>
  <path class="line-blue" d="M 914 724 C 966 704 1024 668 1056 612"/>

  <g>
    <rect class="card fact" x="40" y="150" width="240" height="176"/>
    <rect x="58" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="70" y="186">FACT</text>
    <text class="card-title" x="58" y="216">config profile</text>
    <text class="card-body" x="58" y="246">
      <tspan x="58" dy="0">配置类型入口已核实，</tspan>
      <tspan x="58" dy="19">但默认值和覆盖顺序</tspan>
      <tspan x="58" dy="19">不能由本图外推。</tspan>
    </text>
    <rect x="58" y="292" width="148" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="68" y="307">config_types.rs</text>
  </g>

  <g>
    <rect class="card fact" x="286" y="150" width="226" height="176"/>
    <rect x="304" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="316" y="186">FACT</text>
    <text class="card-title" x="304" y="216">provider + model</text>
    <text class="card-body" x="304" y="246">
      <tspan x="304" dy="0">model preset / info</tspan>
      <tspan x="304" dy="19">入口已核实；最新列表</tspan>
      <tspan x="304" dy="19">随 release 漂移。</tspan>
    </text>
    <rect x="304" y="292" width="162" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="314" y="307">openai_models.rs</text>
  </g>

  <g>
    <rect class="card teaching" x="558" y="150" width="222" height="176"/>
    <rect x="576" y="170" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="595" y="186">教学辅助</text>
    <text class="card-title" x="576" y="216">auth 边界</text>
    <text class="card-body" x="576" y="246">
      <tspan x="576" dy="0">凭据来源、账号边界、</tspan>
      <tspan x="576" dy="19">过期恢复是产品语义；</tspan>
      <tspan x="576" dy="19">不读取真实密钥。</tspan>
    </text>
    <rect x="576" y="292" width="168" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="586" y="307">api_key_or_login</text>
  </g>

  <g>
    <rect class="card fact" x="826" y="150" width="190" height="176"/>
    <rect x="844" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="856" y="186">FACT</text>
    <text class="card-title" x="844" y="216">request context</text>
    <text class="card-body" x="844" y="246">
      <tspan x="844" dy="0">session 初始化时会</tspan>
      <tspan x="844" dy="19">解析模型和基础指令。</tspan>
    </text>
    <rect x="844" y="292" width="112" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="854" y="307">session/mod.rs</text>
  </g>

  <g>
    <rect class="card neutral" x="1062" y="150" width="170" height="176"/>
    <rect x="1080" y="170" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="1099" y="186">教学辅助</text>
    <text class="card-title" x="1080" y="216">用户可见选择</text>
    <text class="card-body" x="1080" y="246">
      <tspan x="1080" dy="0">登录、换 provider、</tspan>
      <tspan x="1080" dy="19">换 model 或调整参数。</tspan>
    </text>
    <rect x="1080" y="292" width="104" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="1090" y="307">recoverable</text>
  </g>

  <g>
    <rect class="card axis" x="40" y="418" width="260" height="150"/>
    <rect x="58" y="438" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="77" y="454">教学辅助</text>
    <text class="card-title" x="58" y="490">成本</text>
    <text class="card-body" x="58" y="520">
      <tspan x="58" dy="0">reasoning effort、窗口、</tspan>
      <tspan x="58" dy="19">重试和 provider 影响预算。</tspan>
    </text>
  </g>

  <g>
    <rect class="card axis" x="346" y="418" width="260" height="150"/>
    <rect x="364" y="438" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="383" y="454">教学辅助</text>
    <text class="card-title" x="364" y="490">能力</text>
    <text class="card-body" x="364" y="520">
      <tspan x="364" dy="0">模型能力、参数支持、</tspan>
      <tspan x="364" dy="19">上下文限制不能假设相同。</tspan>
    </text>
  </g>

  <g>
    <rect class="card axis" x="652" y="418" width="260" height="150"/>
    <rect x="670" y="438" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="689" y="454">教学辅助</text>
    <text class="card-title" x="670" y="490">合规</text>
    <text class="card-body" x="670" y="520">
      <tspan x="670" dy="0">账号归属、密钥来源、</tspan>
      <tspan x="670" dy="19">企业策略影响审计边界。</tspan>
    </text>
  </g>

  <g>
    <rect class="card axis" x="958" y="418" width="260" height="150"/>
    <rect x="976" y="438" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="995" y="454">教学辅助</text>
    <text class="card-title" x="976" y="490">可用性</text>
    <text class="card-body" x="976" y="520">
      <tspan x="976" dy="0">provider 是否存在、凭据</tspan>
      <tspan x="976" dy="19">是否可用、模型是否开放。</tspan>
    </text>
  </g>

  <g>
    <rect class="card fail" x="508" y="636" width="296" height="142"/>
    <rect x="526" y="656" width="44" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="539" y="672">FAIL</text>
    <text class="card-title" x="526" y="710">不可执行的模型上下文</text>
    <text class="card-body" x="526" y="740">
      <tspan x="526" dy="0">缺 provider、缺凭据，或所选</tspan>
      <tspan x="526" dy="19">模型不支持目标能力参数。</tspan>
    </text>
  </g>

  <g>
    <rect class="card recovery" x="850" y="636" width="368" height="142"/>
    <rect x="868" y="656" width="86" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="886" y="672">恢复选择</text>
    <text class="card-title" x="868" y="710">返回可行动配置错误</text>
    <text class="card-body" x="868" y="740">
      <tspan x="868" dy="0">请用户登录、设置 API key、换 provider/model，</tspan>
      <tspan x="868" dy="19">或关闭不支持的参数；不猜测真实密钥。</tspan>
    </text>
  </g>

  <g>
    <rect class="card pending" x="40" y="636" width="302" height="142"/>
    <rect x="58" y="656" width="64" height="22" rx="11" fill="#B7791F"/>
    <text class="badge-text" x="72" y="672">待核实</text>
    <text class="card-title" x="58" y="710">漂移风险</text>
    <text class="card-body" x="58" y="740">
      <tspan x="58" dy="0">最新模型列表、价格、默认值</tspan>
      <tspan x="58" dy="19">和企业策略需要另行核验。</tspan>
    </text>
  </g>

  <g>
    <rect class="card neutral" x="40" y="832" width="1178" height="280"/>
    <text class="card-title" x="62" y="866">图例与边界</text>

    <rect x="62" y="884" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="74" y="900">FACT</text>
    <text class="tiny" x="126" y="900">来自固定 SHA 或 docs/source-evidence.md 的机制点</text>

    <rect x="402" y="884" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="421" y="900">教学辅助</text>
    <text class="tiny" x="504" y="900">成本、能力、合规、可用性和恢复文案</text>

    <rect x="748" y="884" width="64" height="22" rx="11" fill="#B7791F"/>
    <text class="badge-text" x="762" y="900">待核实</text>
    <text class="tiny" x="822" y="900">最新模型、真实价格、默认值、企业策略</text>

    <rect x="62" y="916" width="44" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="75" y="932">FAIL</text>
    <text class="tiny" x="126" y="932">缺 provider、缺凭据或能力不支持时不发起模型调用</text>

    <rect x="402" y="916" width="86" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="420" y="932">恢复选择</text>
    <text class="tiny" x="498" y="932">让用户改配置、重新认证或更换模型</text>

    <text class="mono" x="748" y="932">来源：s07 mock + source-evidence 已登记机制</text>

    <text class="card-title" x="62" y="982">读法</text>
    <text class="card-body" x="62" y="1010">
      <tspan x="62" dy="0">先读上方主路径：config profile 与 provider/model 形成候选请求，auth 决定身份边界，session 侧形成 request context。</tspan>
      <tspan x="62" dy="22">再读中间四个影响面：成本、能力、合规、可用性是产品取舍，不是固定官方默认值。</tspan>
      <tspan x="62" dy="22">最后读 failure path：不可执行时返回可恢复配置错误，不发起真实模型调用，也不猜测或打印凭据。</tspan>
    </text>
  </g>
</svg>
