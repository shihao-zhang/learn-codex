<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">s01 辅助图：turn 中的 agent loop</title>
  <desc id="desc">s01 的可选教学辅助图，展示一个 turn 中用户输入、模型动作、工具调用、observation 回填和继续或停止出口；FACT 只覆盖已登记 loop 主干机制，简化时序和恢复话术是教学辅助，不是 OpenAI 官方架构图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <style><![CDATA[
      .canvas { fill: #F8FAFC; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { rx: 8; ry: 8; stroke-width: 2; }
      .fact { fill: #F0FDFA; stroke: #176B87; }
      .teaching { fill: #FBFAFF; stroke: #6B5B95; stroke-dasharray: 4 4; }
      .fail { fill: #FFF7ED; stroke: #C2410C; }
      .recovery { fill: #EFF6FF; stroke: #2563EB; }
      .neutral { fill: #FFFFFF; stroke: #CBD5E1; }
      .card-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .card-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .badge-text { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .chip-text { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .line-red { fill: none; stroke: #C2410C; stroke-width: 2.5; marker-end: url(#arrow-red); }
      .loop { fill: none; stroke: #2563EB; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-blue); }
    ]]></style>
  </defs>

  <rect class="canvas" width="1280" height="920"/>
  <text class="title" x="40" y="48">s01 辅助图：turn 中的 agent loop</text>
  <text class="subtitle" x="40" y="78">Mermaid 仍是主机制图；本 SVG 用来拆清 loop 主干事实、教学时序和停止出口。</text>

  <rect x="1030" y="34" width="54" height="26" rx="13" fill="#176B87"/>
  <text class="badge-text" x="1042" y="52">FACT</text>
  <rect x="1100" y="34" width="92" height="26" rx="13" fill="#6B5B95"/>
  <text class="badge-text" x="1119" y="52">教学辅助</text>

  <text class="tiny" x="40" y="118">读图方式：灰线是一次推进路径，蓝色虚线是 observation 回填后继续下一轮模型动作，红线是教学 failure path。</text>

  <path class="line" d="M 238 218 L 284 218"/>
  <path class="line" d="M 534 218 L 582 218"/>
  <path class="line" d="M 802 218 L 850 218"/>
  <path class="line" d="M 1000 248 L 1038 248"/>
  <path class="line" d="M 664 352 L 664 394"/>
  <path class="line" d="M 664 514 L 664 552"/>
  <path class="loop" d="M 772 620 C 900 670 940 350 806 282"/>
  <path class="line-blue" d="M 1124 338 C 1100 430 1008 478 900 562"/>
  <path class="line-red" d="M 772 470 L 870 470"/>
  <path class="line-blue" d="M 1060 470 L 1104 470"/>

  <g>
    <rect class="card teaching" x="40" y="150" width="198" height="136"/>
    <rect x="58" y="170" width="38" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="70" y="186">T1</text>
    <text class="card-title" x="58" y="214">用户输入</text>
    <text class="card-body" x="58" y="242">
      <tspan x="58" dy="0">一次 turn 的教学起点。</tspan>
      <tspan x="58" dy="19">不等于一次模型调用。</tspan>
    </text>
    <rect x="58" y="264" width="72" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="68" y="279">turn=t1</text>
  </g>

  <g>
    <rect class="card fact" x="284" y="150" width="250" height="136"/>
    <rect x="302" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="314" y="186">FACT</text>
    <text class="card-title" x="302" y="214">loop 入口推进</text>
    <text class="card-body" x="302" y="242">
      <tspan x="302" dy="0">session loop 负责接收</tspan>
      <tspan x="302" dy="19">提交并推进本轮任务。</tspan>
    </text>
    <rect x="302" y="264" width="130" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="312" y="279">submission_loop</text>
  </g>

  <g>
    <rect class="card teaching" x="582" y="150" width="220" height="136"/>
    <rect x="600" y="170" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="619" y="186">教学辅助</text>
    <text class="card-title" x="600" y="214">模型动作</text>
    <text class="card-body" x="600" y="242">
      <tspan x="600" dy="0">可能给最终答复，</tspan>
      <tspan x="600" dy="19">也可能请求工具。</tspan>
    </text>
    <rect x="600" y="264" width="116" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="610" y="279">action=call_tool</text>
  </g>

  <g>
    <rect class="card fact" x="850" y="150" width="200" height="136"/>
    <rect x="868" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="880" y="186">FACT</text>
    <text class="card-title" x="868" y="214">ToolCall 路由</text>
    <text class="card-body" x="868" y="242">
      <tspan x="868" dy="0">ResponseItem 转成</tspan>
      <tspan x="868" dy="19">受控 tool call。</tspan>
    </text>
    <rect x="868" y="264" width="120" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="878" y="279">router.rs</text>
  </g>

  <g>
    <rect class="card teaching" x="1038" y="150" width="172" height="136"/>
    <rect x="1056" y="170" width="38" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="1068" y="186">T3</text>
    <text class="card-title" x="1056" y="214">工具执行</text>
    <text class="card-body" x="1056" y="242">
      <tspan x="1056" dy="0">示例工具名来自</tspan>
      <tspan x="1056" dy="19">Python mock。</tspan>
    </text>
    <rect x="1056" y="264" width="92" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="1066" y="279">read_file</text>
  </g>

  <g>
    <rect class="card fact" x="534" y="394" width="238" height="120"/>
    <rect x="552" y="414" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="564" y="430">FACT</text>
    <text class="card-title" x="552" y="460">observation 回填</text>
    <text class="card-body" x="552" y="488">
      <tspan x="552" dy="0">工具结果进入模型</tspan>
      <tspan x="552" dy="19">下一步可消费的上下文。</tspan>
    </text>
  </g>

  <g>
    <rect class="card fail" x="870" y="398" width="190" height="112"/>
    <rect x="888" y="418" width="46" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="900" y="434">FAIL</text>
    <text class="card-title" x="888" y="464">工具错误</text>
    <text class="card-body" x="888" y="492">文件不存在等教学阻塞。</text>
  </g>

  <g>
    <rect class="card recovery" x="1104" y="398" width="170" height="112"/>
    <rect x="1122" y="418" width="86" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="1140" y="434">恢复选择</text>
    <text class="card-title" x="1122" y="464">解释或追问</text>
    <text class="card-body" x="1122" y="492">不假装成功。</text>
  </g>

  <g>
    <rect class="card fact" x="534" y="552" width="238" height="120"/>
    <rect x="552" y="572" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="564" y="588">FACT</text>
    <text class="card-title" x="552" y="622">item / event 记录</text>
    <text class="card-body" x="552" y="650">
      <tspan x="552" dy="0">conversation items 写历史，</tspan>
      <tspan x="552" dy="19">并通知观察端。</tspan>
    </text>
  </g>

  <g>
    <rect class="card teaching" x="900" y="552" width="250" height="120"/>
    <rect x="918" y="572" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="937" y="588">教学辅助</text>
    <text class="card-title" x="918" y="622">继续 / 停止出口</text>
    <text class="card-body" x="918" y="650">
      <tspan x="918" dy="0">继续下一轮模型动作，</tspan>
      <tspan x="918" dy="19">或收束为最终答复。</tspan>
    </text>
  </g>

  <g>
    <rect class="card neutral" x="40" y="744" width="1170" height="132"/>
    <text class="card-title" x="62" y="778">图例与边界</text>
    <rect x="62" y="800" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="74" y="816">FACT</text>
    <text class="tiny" x="126" y="816">已登记机制：submission loop、ToolCall 路由、observation 回填、conversation item 记录</text>
    <rect x="62" y="836" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="81" y="852">教学辅助</text>
    <text class="tiny" x="164" y="852">mock event、简化时序、示例工具名、继续/停止文案</text>
    <rect x="690" y="800" width="46" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="702" y="816">FAIL</text>
    <text class="tiny" x="746" y="816">教学 failure path，不声明官方错误码或文案</text>
    <rect x="690" y="836" width="86" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="708" y="852">恢复选择</text>
    <text class="tiny" x="786" y="852">让模型解释、追问或停止，属于产品化教学表达</text>
    <text class="mono" x="62" y="870">来源：README / diagram.mmd / mock.py / docs/source-evidence.md</text>
  </g>
</svg>
