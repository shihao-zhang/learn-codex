<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">s03 辅助图：tool registry dispatch</title>
  <desc id="desc">s03 的可选教学辅助图，展示工具声明、registry、router、handler 和结果回写的受控链路；已登记的 router/registry/dispatch 机制可标 FACT，示例工具名和简化参数是教学辅助，不是 OpenAI 官方架构图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style><![CDATA[
      .canvas { fill: #F8FAFC; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { rx: 8; ry: 8; stroke-width: 2; }
      .fact { fill: #F0FDFA; stroke: #176B87; }
      .teaching { fill: #FBFAFF; stroke: #6B5B95; stroke-dasharray: 4 4; }
      .fail { fill: #FFF7ED; stroke: #C2410C; }
      .recovery { fill: #EFF6FF; stroke: #2563EB; }
      .neutral { fill: #FFFFFF; stroke: #CBD5E1; }
      .card-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .card-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .badge-text { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .chip-text { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-red { fill: none; stroke: #C2410C; stroke-width: 2.5; marker-end: url(#arrow-red); }
      .line-blue { fill: none; stroke: #2563EB; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    ]]></style>
  </defs>

  <rect class="canvas" width="1280" height="960"/>
  <text class="title" x="40" y="48">s03 辅助图：tool registry dispatch</text>
  <text class="subtitle" x="40" y="78">模型请求工具后，运行时必须经过 registry、router、handler 和结果回写边界；示例工具名不是官方类型名。</text>

  <rect x="1030" y="34" width="54" height="26" rx="13" fill="#176B87"/>
  <text class="badge-text" x="1042" y="52">FACT</text>
  <rect x="1100" y="34" width="92" height="26" rx="13" fill="#6B5B95"/>
  <text class="badge-text" x="1119" y="52">教学辅助</text>

  <text class="tiny" x="40" y="118">主路径：工具声明进入 registry，router 把模型输出解析为 ToolCall，dispatch 调用 handler，再把结果回写给模型和观察端。</text>

  <path class="line" d="M 240 222 L 286 222"/>
  <path class="line" d="M 536 222 L 584 222"/>
  <path class="line" d="M 824 222 L 872 222"/>
  <path class="line" d="M 1032 222 L 1080 222"/>
  <path class="line" d="M 656 326 L 656 384"/>
  <path class="line" d="M 778 480 L 850 480"/>
  <path class="line-red" d="M 584 642 L 632 642"/>
  <path class="line-blue" d="M 822 642 L 894 642"/>

  <g>
    <rect class="card fact" x="40" y="150" width="200" height="144"/>
    <rect x="58" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="70" y="186">FACT</text>
    <text class="card-title" x="58" y="214">工具声明</text>
    <text class="card-body" x="58" y="242">
      <tspan x="58" dy="0">router 从 turn context</tspan>
      <tspan x="58" dy="19">组装可见工具规格。</tspan>
    </text>
    <rect x="58" y="270" width="104" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="68" y="285">tool specs</text>
  </g>

  <g>
    <rect class="card fact" x="286" y="150" width="250" height="144"/>
    <rect x="304" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="316" y="186">FACT</text>
    <text class="card-title" x="304" y="214">Registry 索引</text>
    <text class="card-body" x="304" y="242">
      <tspan x="304" dy="0">从工具集合建索引，</tspan>
      <tspan x="304" dy="19">并处理重复工具名。</tspan>
    </text>
    <rect x="304" y="270" width="116" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="314" y="285">registry.rs</text>
  </g>

  <g>
    <rect class="card teaching" x="584" y="150" width="240" height="144"/>
    <rect x="602" y="170" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="621" y="186">教学辅助</text>
    <text class="card-title" x="602" y="214">模型请求工具</text>
    <text class="card-body" x="602" y="242">
      <tspan x="602" dy="0">示例工具名来自 mock，</tspan>
      <tspan x="602" dy="19">不是官方 handler 类型。</tspan>
    </text>
    <rect x="602" y="270" width="110" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="612" y="285">apply_patch</text>
  </g>

  <g>
    <rect class="card fact" x="872" y="150" width="160" height="144"/>
    <rect x="890" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="902" y="186">FACT</text>
    <text class="card-title" x="890" y="214">Router 解析</text>
    <text class="card-body" x="890" y="242">
      <tspan x="890" dy="0">模型 response item</tspan>
      <tspan x="890" dy="19">变成 ToolCall。</tspan>
    </text>
  </g>

  <g>
    <rect class="card fact" x="1080" y="150" width="170" height="144"/>
    <rect x="1098" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="1110" y="186">FACT</text>
    <text class="card-title" x="1098" y="214">Dispatch</text>
    <text class="card-body" x="1098" y="242">
      <tspan x="1098" dy="0">pre/post hook、</tspan>
      <tspan x="1098" dy="19">handler 和 lifecycle。</tspan>
    </text>
  </g>

  <g>
    <rect class="card fact" x="534" y="384" width="244" height="136"/>
    <rect x="552" y="404" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="564" y="420">FACT</text>
    <text class="card-title" x="552" y="454">Handler 调用</text>
    <text class="card-body" x="552" y="482">
      <tspan x="552" dy="0">registry dispatch 调用具体</tspan>
      <tspan x="552" dy="19">handler 并处理结果转换。</tspan>
    </text>
  </g>

  <g>
    <rect class="card fact" x="850" y="384" width="260" height="136"/>
    <rect x="868" y="404" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="880" y="420">FACT</text>
    <text class="card-title" x="868" y="454">结果回写</text>
    <text class="card-body" x="868" y="482">
      <tspan x="868" dy="0">工具输出转换为模型可继续</tspan>
      <tspan x="868" dy="19">消费的结果和观察端事件。</tspan>
    </text>
  </g>

  <g>
    <rect class="card teaching" x="338" y="574" width="246" height="142"/>
    <rect x="356" y="594" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="375" y="610">教学辅助</text>
    <text class="card-title" x="356" y="644">未知工具请求</text>
    <text class="card-body" x="356" y="674">
      <tspan x="356" dy="0">mock 示例用于说明</tspan>
      <tspan x="356" dy="19">能力边界不能绕过。</tspan>
    </text>
    <rect x="356" y="698" width="120" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="366" y="713">delete_world</text>
  </g>

  <g>
    <rect class="card fail" x="632" y="574" width="190" height="142"/>
    <rect x="650" y="594" width="46" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="662" y="610">FAIL</text>
    <text class="card-title" x="650" y="644">Registry 未命中</text>
    <text class="card-body" x="650" y="674">
      <tspan x="650" dy="0">不把未知名称交给</tspan>
      <tspan x="650" dy="19">shell 或任意执行。</tspan>
    </text>
  </g>

  <g>
    <rect class="card recovery" x="894" y="574" width="250" height="142"/>
    <rect x="912" y="594" width="86" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="930" y="610">恢复选择</text>
    <text class="card-title" x="912" y="644">结构化 tool error</text>
    <text class="card-body" x="912" y="674">
      <tspan x="912" dy="0">让模型改路、解释缺失能力，</tspan>
      <tspan x="912" dy="19">或提示启用工具。</tspan>
    </text>
  </g>

  <g>
    <rect class="card neutral" x="40" y="792" width="1170" height="126"/>
    <text class="card-title" x="62" y="826">图例与边界</text>
    <rect x="62" y="848" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="74" y="864">FACT</text>
    <text class="tiny" x="126" y="864">已登记机制：model-visible specs、registry 构造、router 解析、dispatch、handler 调用和结果转换</text>
    <rect x="62" y="884" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="81" y="900">教学辅助</text>
    <text class="tiny" x="164" y="900">示例工具名、mock handler 名、简化参数和产品解释</text>
    <rect x="760" y="848" width="46" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="772" y="864">FAIL</text>
    <text class="tiny" x="814" y="864">未知工具 failure path 来自 mock，不声明官方错误格式</text>
    <rect x="760" y="884" width="86" height="22" rx="11" fill="#2563EB"/>
    <text class="badge-text" x="778" y="900">恢复选择</text>
    <text class="tiny" x="856" y="900">结构化错误后的改路或解释属于教学表达</text>
  </g>
</svg>
