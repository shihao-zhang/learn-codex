<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
  <title id="title">s10 辅助图：四条扩展能力线与待核实边界</title>
  <desc id="desc">s10 的可选教学辅助图，展示 MCP、dynamic tools、extension tools 和 skills 四条能力线的来源、入口、治理与待核实边界；本图不把四者画成统一官方扩展产品承诺，dynamic tools experimental、通用 extension 用户入口和统一治理路径均标为待核实，不是 OpenAI 官方架构图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A4B00"/>
    </marker>
    <style><![CDATA[
      .canvas { fill: #F8FAFC; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #176B87; }
      .lane-label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .column-label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; letter-spacing: 0; }
      .card { rx: 8; ry: 8; stroke-width: 2; }
      .fact { fill: #F0FDFA; stroke: #176B87; }
      .pending { fill: #FFF7ED; stroke: #B45309; stroke-dasharray: 7 5; }
      .teaching { fill: #FBFAFF; stroke: #6B5B95; stroke-dasharray: 4 4; }
      .neutral { fill: #FFFFFF; stroke: #CBD5E1; }
      .lane { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .card-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .card-body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .badge-text { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .chip-text { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-pending { fill: none; stroke: #B45309; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow-pending); }
      .stop-line { fill: none; stroke: #B45309; stroke-width: 2.5; stroke-dasharray: 7 5; }
    ]]></style>
  </defs>

  <rect class="canvas" width="1280" height="1040"/>
  <text class="title" x="40" y="48">s10 辅助图：四条扩展能力线与待核实边界</text>
  <text class="subtitle" x="40" y="78">第一眼按行读：来源 -> 入口/暴露 -> 治理/运行时 -> 待核实边界。四行并列，不代表统一官方扩展产品。</text>

  <rect x="894" y="34" width="54" height="26" rx="13" fill="#176B87"/>
  <text class="badge-text" x="906" y="52">FACT</text>
  <rect x="966" y="34" width="64" height="26" rx="13" fill="#B45309"/>
  <text class="badge-text" x="980" y="52">待核实</text>
  <rect x="1048" y="34" width="84" height="26" rx="13" fill="#6B5B95"/>
  <text class="badge-text" x="1064" y="52">教学辅助</text>
  <rect x="1148" y="34" width="86" height="26" rx="13" fill="#334155"/>
  <text class="badge-text" x="1165" y="52">非官方图</text>

  <text class="column-label" x="126" y="126">来源 / 声明</text>
  <text class="column-label" x="386" y="126">用户入口 / 暴露</text>
  <text class="column-label" x="682" y="126">治理 / 运行时</text>
  <text class="column-label" x="988" y="126">不可升级为事实的边界</text>

  <path class="line" d="M 310 216 L 342 216"/>
  <path class="line" d="M 620 216 L 652 216"/>
  <path class="line-pending" d="M 930 216 L 962 216"/>
  <path class="line" d="M 310 398 L 342 398"/>
  <path class="line" d="M 620 398 L 652 398"/>
  <path class="line-pending" d="M 930 398 L 962 398"/>
  <path class="line" d="M 310 580 L 342 580"/>
  <path class="line" d="M 620 580 L 652 580"/>
  <path class="line-pending" d="M 930 580 L 962 580"/>
  <path class="line" d="M 310 762 L 342 762"/>
  <path class="line" d="M 620 762 L 652 762"/>
  <path class="line-pending" d="M 930 762 L 962 762"/>

  <g>
    <rect class="lane" x="40" y="144" width="1198" height="148" rx="8"/>
    <text class="lane-label" x="60" y="174">MCP</text>

    <rect class="card fact" x="90" y="188" width="220" height="80"/>
    <rect x="108" y="204" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="120" y="220">FACT</text>
    <text class="card-title" x="108" y="246">server 与配置来源</text>
    <text class="card-body" x="108" y="265">stdio/http、enabled、tool filter。</text>

    <rect class="card fact" x="342" y="176" width="278" height="104"/>
    <rect x="360" y="192" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="372" y="208">FACT</text>
    <text class="card-title" x="360" y="235">CLI / discovery / exposure</text>
    <text class="card-body" x="360" y="257">
      <tspan x="360" dy="0">`codex mcp`、list tools、</tspan>
      <tspan x="360" dy="17">direct/deferred tool exposure。</tspan>
    </text>

    <rect class="card fact" x="652" y="176" width="278" height="104"/>
    <rect x="670" y="192" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="682" y="208">FACT</text>
    <text class="card-title" x="670" y="235">handler / approval 线索</text>
    <text class="card-body" x="670" y="257">
      <tspan x="670" dy="0">ToolExecutor、elicitation、</tspan>
      <tspan x="670" dy="17">guardian review 与自动批准 helper。</tspan>
    </text>

    <rect class="card pending" x="962" y="176" width="246" height="104"/>
    <rect x="980" y="192" width="64" height="22" rx="11" fill="#B45309"/>
    <text class="badge-text" x="994" y="208">待核实</text>
    <text class="card-title" x="980" y="235">产品体验不外推</text>
    <text class="card-body" x="980" y="257">
      <tspan x="980" dy="0">不证明所有 server、所有 UI、</tspan>
      <tspan x="980" dy="17">认证失败恢复都稳定一致。</tspan>
    </text>
  </g>

  <g>
    <rect class="lane" x="40" y="326" width="1198" height="148" rx="8"/>
    <text class="lane-label" x="60" y="356">dynamic tools</text>

    <rect class="card fact" x="90" y="370" width="220" height="80"/>
    <rect x="108" y="386" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="120" y="402">FACT</text>
    <text class="card-title" x="108" y="428">app-server 输入</text>
    <text class="card-body" x="108" y="447">thread start 传入 tool spec。</text>

    <rect class="card pending" x="342" y="358" width="278" height="104"/>
    <rect x="360" y="374" width="64" height="22" rx="11" fill="#B45309"/>
    <text class="badge-text" x="374" y="390">待核实</text>
    <text class="card-title" x="360" y="417">experimental API</text>
    <text class="card-body" x="360" y="439">
      <tspan x="360" dy="0">`thread/start.dynamicTools` 标为</tspan>
      <tspan x="360" dy="17">experimental；非稳定 CLI 入口。</tspan>
    </text>

    <rect class="card fact" x="652" y="358" width="278" height="104"/>
    <rect x="670" y="374" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="682" y="390">FACT</text>
    <text class="card-title" x="670" y="417">request / response 闭环</text>
    <text class="card-body" x="670" y="439">
      <tspan x="670" dy="0">core 发 DynamicToolCallRequest，</tspan>
      <tspan x="670" dy="17">client response 再回写。</tspan>
    </text>

    <rect class="card pending" x="962" y="358" width="246" height="104"/>
    <rect x="980" y="374" width="64" height="22" rx="11" fill="#B45309"/>
    <text class="badge-text" x="994" y="390">待核实</text>
    <text class="card-title" x="980" y="417">客户端产品边界</text>
    <text class="card-body" x="980" y="439">
      <tspan x="980" dy="0">外部 client 实现、发现方式和</tspan>
      <tspan x="980" dy="17">用户可见体验未闭环。</tspan>
    </text>
  </g>

  <g>
    <rect class="lane" x="40" y="508" width="1198" height="148" rx="8"/>
    <text class="lane-label" x="60" y="538">extension tools</text>

    <rect class="card fact" x="90" y="552" width="220" height="80"/>
    <rect x="108" y="568" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="120" y="584">FACT</text>
    <text class="card-title" x="108" y="610">extension API</text>
    <text class="card-body" x="108" y="629">registry 与 tool contributor。</text>

    <rect class="card fact" x="342" y="540" width="278" height="104"/>
    <rect x="360" y="556" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="372" y="572">FACT</text>
    <text class="card-title" x="360" y="599">内置 app-server extensions</text>
    <text class="card-body" x="360" y="621">
      <tspan x="360" dy="0">web-search、image-generation、</tspan>
      <tspan x="360" dy="17">memories 等内置注册路径。</tspan>
    </text>

    <rect class="card fact" x="652" y="540" width="278" height="104"/>
    <rect x="670" y="556" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="682" y="572">FACT</text>
    <text class="card-title" x="670" y="599">adapter 进入 runtime</text>
    <text class="card-body" x="670" y="621">
      <tspan x="670" dy="0">core 收集 contributors，</tspan>
      <tspan x="670" dy="17">planning 阶段加入 tool runtime。</tspan>
    </text>

    <rect class="card pending" x="962" y="540" width="246" height="104"/>
    <rect x="980" y="556" width="64" height="22" rx="11" fill="#B45309"/>
    <text class="badge-text" x="994" y="572">待核实</text>
    <text class="card-title" x="980" y="599">通用用户入口</text>
    <text class="card-body" x="980" y="621">
      <tspan x="980" dy="0">安装、发现、授权、市场式</tspan>
      <tspan x="980" dy="17">分发入口未闭环。</tspan>
    </text>
  </g>

  <g>
    <rect class="lane" x="40" y="690" width="1198" height="148" rx="8"/>
    <text class="lane-label" x="60" y="720">skills</text>

    <rect class="card fact" x="90" y="734" width="220" height="80"/>
    <rect x="108" y="750" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="120" y="766">FACT</text>
    <text class="card-title" x="108" y="792">skills directory</text>
    <text class="card-body" x="108" y="811">repo/user/admin/system/plugin roots。</text>

    <rect class="card fact" x="342" y="722" width="278" height="104"/>
    <rect x="360" y="738" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="372" y="754">FACT</text>
    <text class="card-title" x="360" y="781">TUI 入口与配置启停</text>
    <text class="card-body" x="360" y="803">
      <tspan x="360" dy="0">`/skills`、`$`/`@` 列表、</tspan>
      <tspan x="360" dy="17">config rules 与 system cache。</tspan>
    </text>

    <rect class="card fact" x="652" y="722" width="278" height="104"/>
    <rect x="670" y="738" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="682" y="754">FACT</text>
    <text class="card-title" x="670" y="781">instructions / mention</text>
    <text class="card-body" x="670" y="803">
      <tspan x="670" dy="0">available skills 进入上下文，</tspan>
      <tspan x="670" dy="17">explicit mention 注入 SKILL.md。</tspan>
    </text>

    <rect class="card pending" x="962" y="722" width="246" height="104"/>
    <rect x="980" y="738" width="64" height="22" rx="11" fill="#B45309"/>
    <text class="badge-text" x="994" y="754">待核实</text>
    <text class="card-title" x="980" y="781">跨客户端语义</text>
    <text class="card-body" x="980" y="803">
      <tspan x="980" dy="0">不等于所有客户端入口一致，</tspan>
      <tspan x="980" dy="17">也不套用其他产品 skills。</tspan>
    </text>
  </g>

  <g>
    <rect class="card teaching" x="40" y="870" width="560" height="112"/>
    <rect x="62" y="892" width="84" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="78" y="908">教学辅助</text>
    <text class="card-title" x="62" y="940">产品治理问题可以同框比较，但不能合并成官方事实</text>
    <text class="card-body" x="62" y="964">
      <tspan x="62" dy="0">谁声明？谁授权？谁执行？谁记录？失败后谁负责？</tspan>
      <tspan x="62" dy="17">这些是读者分析框架，不是已经核实的统一治理实现。</tspan>
    </text>
  </g>

  <g>
    <rect class="card pending" x="640" y="870" width="598" height="112"/>
    <rect x="662" y="892" width="64" height="22" rx="11" fill="#B45309"/>
    <text class="badge-text" x="676" y="908">待核实</text>
    <text class="card-title" x="662" y="940">统一治理路径尚不能画成已验证流水线</text>
    <text class="card-body" x="662" y="964">
      <tspan x="662" dy="0">MCP、dynamic tools、extension tools、skills 都能进入 tool surface，</tspan>
      <tspan x="662" dy="17">但当前证据不支持“同一审批、同一授权、同一审计”的官方承诺。</tspan>
    </text>
  </g>

  <g>
    <rect class="card neutral" x="40" y="998" width="1198" height="26"/>
    <text class="tiny" x="58" y="1016">边界：Mermaid 仍是主机制图；本 SVG 只是 s10 可选教学辅助图。s10 状态保持待核实，不新增官方事实，不修改 source evidence。</text>
  </g>
</svg>
