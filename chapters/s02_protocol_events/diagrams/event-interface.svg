<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">s02 辅助图：protocol event 与产品界面</title>
  <desc id="desc">s02 的可选教学辅助图，展示 request、response item、protocol event、trace context 和 UI 状态之间的教学关系；协议结构入口可标 FACT，UI 呈现建议和 mock event 名称是教学辅助，不是 OpenAI 官方架构图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <style><![CDATA[
      .canvas { fill: #F8FAFC; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { rx: 8; ry: 8; stroke-width: 2; }
      .fact { fill: #F0FDFA; stroke: #176B87; }
      .teaching { fill: #FBFAFF; stroke: #6B5B95; stroke-dasharray: 4 4; }
      .fail { fill: #FFF7ED; stroke: #C2410C; }
      .neutral { fill: #FFFFFF; stroke: #CBD5E1; }
      .card-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .card-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .badge-text { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .chip-text { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .line-red { fill: none; stroke: #C2410C; stroke-width: 2.5; marker-end: url(#arrow-red); }
      .trace-line { fill: none; stroke: #176B87; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect class="canvas" width="1280" height="940"/>
  <text class="title" x="40" y="48">s02 辅助图：protocol event 与产品界面</text>
  <text class="subtitle" x="40" y="78">事件协议把内部动作翻译成客户端可理解的状态；UI 文案和展示策略属于教学辅助。</text>

  <rect x="1030" y="34" width="54" height="26" rx="13" fill="#176B87"/>
  <text class="badge-text" x="1042" y="52">FACT</text>
  <rect x="1100" y="34" width="92" height="26" rx="13" fill="#6B5B95"/>
  <text class="badge-text" x="1119" y="52">教学辅助</text>

  <text class="tiny" x="40" y="118">主路径：request 和 response item 进入协议边界，event 驱动客户端状态，trace context 帮助关联调试。</text>

  <path class="line" d="M 238 220 L 286 220"/>
  <path class="line" d="M 536 220 L 584 220"/>
  <path class="line" d="M 824 220 L 872 220"/>
  <path class="line" d="M 1032 220 L 1080 220"/>
  <path class="trace-line" d="M 690 412 C 760 366 786 312 794 286"/>
  <path class="line-red" d="M 536 470 L 584 470"/>
  <path class="line" d="M 824 470 L 900 470"/>

  <g>
    <rect class="card teaching" x="40" y="150" width="198" height="140"/>
    <rect x="58" y="170" width="38" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="70" y="186">T1</text>
    <text class="card-title" x="58" y="214">客户端 request</text>
    <text class="card-body" x="58" y="242">
      <tspan x="58" dy="0">用户输入或工具结果</tspan>
      <tspan x="58" dy="19">进入运行时。</tspan>
    </text>
    <rect x="58" y="266" width="88" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text class="chip-text" x="68" y="281">UserInput</text>
  </g>

  <g>
    <rect class="card fact" x="286" y="150" width="250" height="140"/>
    <rect x="304" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="316" y="186">FACT</text>
    <text class="card-title" x="304" y="214">输入 / 输出项</text>
    <text class="card-body" x="304" y="242">
      <tspan x="304" dy="0">protocol 层有模型输入</tspan>
      <tspan x="304" dy="19">输出 item 类型入口。</tspan>
    </text>
    <rect x="304" y="266" width="168" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="314" y="281">ResponseInputItem</text>
  </g>

  <g>
    <rect class="card fact" x="584" y="150" width="240" height="140"/>
    <rect x="602" y="170" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="614" y="186">FACT</text>
    <text class="card-title" x="602" y="214">Protocol event</text>
    <text class="card-body" x="602" y="242">
      <tspan x="602" dy="0">Event / EventMsg 是</tspan>
      <tspan x="602" dy="19">客户端可消费边界。</tspan>
    </text>
    <rect x="602" y="266" width="130" height="20" rx="10" fill="#CCFBF1" stroke="#99F6E4"/>
    <text class="chip-text" x="612" y="281">EventMsg</text>
  </g>

  <g>
    <rect class="card teaching" x="872" y="150" width="160" height="140"/>
    <rect x="890" y="170" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="909" y="186">教学辅助</text>
    <text class="card-title" x="890" y="214">传输 / stream</text>
    <text class="card-body" x="890" y="242">
      <tspan x="890" dy="0">把状态发给</tspan>
      <tspan x="890" dy="19">CLI 或界面。</tspan>
    </text>
  </g>

  <g>
    <rect class="card teaching" x="1080" y="150" width="170" height="140"/>
    <rect x="1098" y="170" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="1117" y="186">教学辅助</text>
    <text class="card-title" x="1098" y="214">客户端状态机</text>
    <text class="card-body" x="1098" y="242">
      <tspan x="1098" dy="0">显示进度、输出、</tspan>
      <tspan x="1098" dy="19">错误或等待授权。</tspan>
    </text>
  </g>

  <g>
    <rect class="card fact" x="450" y="412" width="240" height="128"/>
    <rect x="468" y="432" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="480" y="448">FACT</text>
    <text class="card-title" x="468" y="482">trace context</text>
    <text class="card-body" x="468" y="510">
      <tspan x="468" dy="0">协议层包含 trace context</tspan>
      <tspan x="468" dy="19">相关字段入口。</tspan>
    </text>
  </g>

  <g>
    <rect class="card fail" x="286" y="402" width="250" height="140"/>
    <rect x="304" y="422" width="46" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="316" y="438">FAIL</text>
    <rect x="360" y="422" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="379" y="438">教学辅助</text>
    <text class="card-title" x="304" y="476">schema 不匹配</text>
    <text class="card-body" x="304" y="506">
      <tspan x="304" dy="0">mock 中字段 `toolz`</tspan>
      <tspan x="304" dy="19">只是教学 failure path。</tspan>
    </text>
  </g>

  <g>
    <rect class="card teaching" x="584" y="402" width="240" height="140"/>
    <rect x="602" y="422" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="621" y="438">教学辅助</text>
    <text class="card-title" x="602" y="476">稳定错误事件</text>
    <text class="card-body" x="602" y="506">
      <tspan x="602" dy="0">产品上避免长 spinner，</tspan>
      <tspan x="602" dy="19">但不声明官方错误码。</tspan>
    </text>
  </g>

  <g>
    <rect class="card teaching" x="900" y="402" width="250" height="140"/>
    <rect x="918" y="422" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="937" y="438">教学辅助</text>
    <text class="card-title" x="918" y="476">UI 可读状态</text>
    <text class="card-body" x="918" y="506">
      <tspan x="918" dy="0">“正在思考 / 运行工具 /</tspan>
      <tspan x="918" dy="19">失败原因”是界面建议。</tspan>
    </text>
  </g>

  <g>
    <rect class="card neutral" x="40" y="622" width="1170" height="236"/>
    <text class="card-title" x="62" y="656">图例与边界</text>
    <rect x="62" y="678" width="54" height="22" rx="11" fill="#176B87"/>
    <text class="badge-text" x="74" y="694">FACT</text>
    <text class="tiny" x="126" y="694">已登记机制：Event / EventMsg、模型输入输出 item、trace context 字段入口</text>
    <rect x="62" y="714" width="92" height="22" rx="11" fill="#6B5B95"/>
    <text class="badge-text" x="81" y="730">教学辅助</text>
    <text class="tiny" x="164" y="730">mock event 名称、UI 呈现建议、传输简化和兼容降级文案</text>
    <rect x="62" y="750" width="46" height="22" rx="11" fill="#C2410C"/>
    <text class="badge-text" x="74" y="766">FAIL</text>
    <text class="tiny" x="118" y="766">schema drift failure path 来自教学 mock，不声明官方校验策略或错误码</text>
    <text class="mono" x="62" y="802">示例事件：turn_started / model_message_delta / turn_completed 均为 mock 名称</text>
    <text class="tiny" x="62" y="832">本图不使用待核实或 DENY：本批不引入 s08/s10 未闭环语义，也不展示人工拒绝动作。</text>
  </g>
</svg>
